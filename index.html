<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Battle Tanks</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg1:#0e1117; --bg2:#161b26;
    --panel:#1c2230; --panel2:#232b3d;
    --text:#e8ecf4; --muted:#8b95a8;
    --accent:#f7c948; --accent2:#4fc3f7;
    --danger:#ef5350;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:radial-gradient(1200px 700px at 50% -10%, #1c2536 0%, var(--bg1) 55%, #0a0d12 100%);
    color:var(--text);
    font-family:"Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 12px 30px;
  }
  .wrap{ width:100%; max-width:660px; }
  header{ text-align:center; margin-bottom:14px; }
  header h1{
    margin:0; font-size:34px; letter-spacing:3px; font-weight:900;
    background:linear-gradient(180deg,#ffe08a,#f7c948 60%,#d99a1f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  header .sub{ margin:4px 0 0; color:var(--muted); letter-spacing:6px; font-size:12px; text-transform:uppercase; }
  .hud{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid #2a3347; border-radius:12px;
    padding:10px 14px; margin-bottom:12px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .stat{ font-size:14px; color:var(--muted); }
  .stat b{ color:var(--text); font-size:17px; font-weight:800; margin-left:4px; }
  .stat#livesStat{ letter-spacing:2px; }
  .hud .spacer{ flex:1; }
  .hud button{
    background:var(--panel2); color:var(--text); border:1px solid #34405a;
    border-radius:8px; width:38px; height:38px; font-size:18px; cursor:pointer;
    transition:transform .08s, background .15s;
  }
  .hud button:hover{ background:#2b3550; }
  .hud button:active{ transform:scale(.92); }
  .stage{
    position:relative; width:100%; aspect-ratio:1/1;
    border-radius:12px; overflow:hidden; border:2px solid #2a3347;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
    background:#10141c;
  }
  canvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(8,10,15,.82); backdrop-filter:blur(3px);
    animation:fade .25s ease; padding:20px;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .overlay h2{ margin:0; font-size:34px; letter-spacing:2px; }
  .overlay p{ margin:0; color:var(--muted); font-size:15px; line-height:1.7; }
  .overlay .big{ font-size:20px; color:var(--text); font-weight:800; }
  .overlay button{
    margin-top:6px; font-size:17px; font-weight:800; letter-spacing:1px;
    color:#241c04; background:linear-gradient(180deg,#ffe08a,#f7c948);
    border:none; border-radius:10px; padding:12px 28px; cursor:pointer;
    box-shadow:0 5px 0 #c9931c, 0 10px 24px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .overlay button:hover{ filter:brightness(1.05); }
  .overlay button:active{ transform:translateY(4px); box-shadow:0 1px 0 #c9931c, 0 4px 12px rgba(0,0,0,.4); }
  .overlay .keys{ color:#9fb0cc; font-size:13px; }
  .overlay .keys span{ display:inline-block; background:#232b3d; border:1px solid #3a4763; border-bottom-width:3px; border-radius:5px; padding:2px 7px; margin:0 2px; font-family:monospace; }
  .hidden{ display:none !important; }
  footer{ margin-top:14px; color:var(--muted); font-size:12.5px; text-align:center; line-height:1.9; }
  footer span{ display:inline-block; background:#1c2230; border:1px solid #2a3347; border-radius:5px; padding:1px 7px; margin:0 2px; font-family:monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>坦克大战</h1>
    <div class="sub">Battle Tanks</div>
  </header>

  <div class="hud">
    <div class="stat">分数<b id="score">0</b></div>
    <div class="stat">生命<b id="lives" style="color:#ff6b6b;">❤️❤️❤️</b></div>
    <div class="stat">关卡<b id="level">1</b></div>
    <div class="stat">剩余敌人<b id="enemies">0</b></div>
    <div class="spacer"></div>
    <button id="muteBtn" title="静音 (M)">🔊</button>
    <button id="pauseBtn" title="暂停 (P)">⏸️</button>
  </div>

  <div class="stage">
    <canvas id="game" width="416" height="416"></canvas>

    <div class="overlay" id="ov-menu">
      <h2>🛡️ 坦克大战</h2>
      <p>保卫你的基地，消灭所有来犯的敌方坦克。<br>吃掉敌人掉落的道具提升火力！</p>
      <button id="btn-start">开始游戏</button>
      <div class="keys">
        <span>W A S D</span> / <span>方向键</span> 移动&nbsp;&nbsp;
        <span>空格</span> / <span>J</span> 射击
      </div>
    </div>

    <div class="overlay hidden" id="ov-pause">
      <h2>⏸️ 已暂停</h2>
      <p>休息一下，随时继续战斗。</p>
      <button id="btn-resume">继续游戏</button>
    </div>

    <div class="overlay hidden" id="ov-levelclear">
      <h2>🎉 关卡完成！</h2>
      <p class="big" id="levelBonus"></p>
      <button id="btn-next">下一关</button>
    </div>

    <div class="overlay hidden" id="ov-gameover">
      <h2 style="color:var(--danger)">💥 游戏结束</h2>
      <p>基地被摧毁了……<br>你的最终得分：<span class="big" id="finalScore"></span></p>
      <button id="btn-restart">重新开始</button>
    </div>

    <div class="overlay hidden" id="ov-win">
      <h2>🏆 恭喜通关！</h2>
      <p>你成功守住了基地！<br>最终得分：<span class="big" id="winScore"></span></p>
      <button id="btn-again">再玩一次</button>
    </div>
  </div>

  <footer>
    <span>WASD/方向键</span> 移动 · <span>空格/J</span> 射击 · <span>P</span> 暂停 · <span>M</span> 静音 · <span>Enter</span> 确认
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================= 常量 ============================= */
  var COLS = 13, ROWS = 13, BLOCK = 32, FIELD = COLS * BLOCK, TANK = 32;
  var T_EMPTY=0, T_BRICK=1, T_STEEL=2, T_WATER=3, T_TREE=4, T_BASE=5;
  var CHAR_MAP = {'.':T_EMPTY,'B':T_BRICK,'S':T_STEEL,'W':T_WATER,'T':T_TREE,'F':T_BASE,'E':T_EMPTY};
  var DIRX = [0, 1, 0, -1]; // 上 右 下 左
  var DIRY = [-1, 0, 1, 0];

  /* ============================= 关卡地图 ============================= */
  var LEVELS = [
    [
      "E.....E.....E",
      "..T.......T..",
      "..B.B.B.B.B..",
      "..T.......T..",
      ".B...B.B...B.",
      ".B.........B.",
      ".....SSS.....",
      ".B.........B.",
      ".B...B.B...B.",
      "..T.......T..",
      "..B.B.B.B.B..",
      "....BBBBB....",
      ".....BFB.....",
    ],
    [
      "E.....E.....E",
      "..T.......T..",
      "..S.B.B.B.S..",
      "..S...T...S..",
      "....BB.BB....",
      ".B.B.B.B.B.B.",
      ".B.S.....S.B.",
      ".....WWW.....",
      ".B.S.....S.B.",
      ".B.B.B.B.B.B.",
      "....BB.BB....",
      "..S...T...S..",
      ".....BFB.....",
    ],
    [
      "E.....E.....E",
      "..T.......T..",
      "..S.B.B.B.S..",
      "..B.S...S.B..",
      "..B.B.T.B.B..",
      ".B.B.W.W.B.B.",
      ".B...W.W...B.",
      ".....WWW.....",
      ".B...W.W...B.",
      ".B.B.W.W.B.B.",
      "..B.B.T.B.B..",
      "..B.S.S.S.B..",
      ".....BFB.....",
    ],
  ];

  var ENEMY_SETS = [
    ['basic','basic','fast','basic','carrier','basic','fast','basic','basic','armor','fast','basic'],
    ['basic','fast','basic','power','carrier','fast','armor','basic','fast','power','basic','carrier','armor','fast','basic','power'],
    ['fast','power','basic','armor','carrier','power','fast','armor','basic','power','armor','fast','carrier','power','armor','fast','basic','power','armor','carrier'],
  ];

  var ENEMY_TYPES = {
    basic:  { hp:1, speed:55,  bullet:220, score:100, color:'#9aa0a6', name:'普通' },
    fast:   { hp:1, speed:108, bullet:240, score:200, color:'#4db6ac', name:'快速' },
    power:  { hp:1, speed:55,  bullet:360, score:300, color:'#e53935', name:'强力' },
    armor:  { hp:3, speed:55,  bullet:220, score:400, color:'#2e7d32', name:'装甲' },
    carrier:{ hp:1, speed:62,  bullet:220, score:500, color:'#ff8f00', name:'运输' },
  };

  /* ============================= Canvas ============================= */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var $ = function(id){ return document.getElementById(id); };

  /* ============================= 状态 ============================= */
  var state = {
    mode: 'menu',       // menu | playing | pause | levelclear | gameover | win
    level: 0,
    score: 0,
    lives: 3,
    grid: [],
    player: null,
    enemies: [],
    bullets: [],
    powerups: [],
    effects: [],
    enemyQueue: [],
    spawnTimer: 0,
    freezeTimer: 0,
  };
  var keys = new Set();
  var animTime = 0;

  /* ============================= 音效 ============================= */
  var audioCtx = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol, slide){
    if(muted || !audioCtx) return;
    try{
      var t = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    }catch(e){}
  }
  function noise(dur, vol){
    if(muted || !audioCtx) return;
    try{
      var n = Math.floor(audioCtx.sampleRate * dur);
      var buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      src.connect(g); g.connect(audioCtx.destination);
      src.start();
    }catch(e){}
  }
  function playSound(name){
    switch(name){
      case 'shoot':    beep(950,0.08,'square',0.08,-520); break;
      case 'brick':    noise(0.14,0.14); beep(210,0.14,'sawtooth',0.09,-110); break;
      case 'steelHit': beep(1400,0.05,'square',0.07); break;
      case 'steel':    noise(0.2,0.2); beep(150,0.2,'sawtooth',0.11,-60); break;
      case 'explosion':noise(0.4,0.28); beep(90,0.4,'sawtooth',0.16,-42); break;
      case 'pickup':   beep(600,0.09,'square',0.13,220); setTimeout(function(){ beep(900,0.12,'square',0.13,220); },90); break;
      case 'gameover': beep(320,0.55,'sawtooth',0.2,-200); break;
      case 'win':      beep(523,0.12,'square',0.14); setTimeout(function(){beep(659,0.12,'square',0.14);},120);
                       setTimeout(function(){beep(784,0.12,'square',0.14);},240);
                       setTimeout(function(){beep(1047,0.3,'square',0.16);},360); break;
    }
  }

  /* ============================= 工具 ============================= */
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2){
    return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
  }
  function shade(hex, amt){
    var c = hex.replace('#','');
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    r = clamp(r+amt,0,255); g = clamp(g+amt,0,255); b = clamp(b+amt,0,255);
    return 'rgb('+r+','+g+','+b+')';
  }

  /* ============================= 地图 ============================= */
  function parseMap(rows){
    var g = [];
    for(var y=0; y<ROWS; y++){
      var line = rows[y] || '';
      var row = [];
      for(var x=0; x<COLS; x++){
        var c = line[x] || '.';
        row.push(CHAR_MAP[c] !== undefined ? CHAR_MAP[c] : T_EMPTY);
      }
      g.push(row);
    }
    return g;
  }

  /* ============================= 实体 ============================= */
  function makePlayer(){
    return { x:1*BLOCK, y:12*BLOCK, dir:0, speed:132, power:0, cooldown:0,
             isPlayer:true, invincible:2.0, flash:0, hp:1 };
  }
  function makeEnemy(type, x, y){
    var s = ENEMY_TYPES[type];
    return { x:x, y:y, dir:2, speed:s.speed, hp:s.hp, type:type, color:s.color,
             score:s.score, bulletSpeed:s.bullet, cooldown:0.6+Math.random()*0.8,
             think:0.5+Math.random()*0.6, isPlayer:false, invincible:0, flash:0 };
  }
  function pickSpawnSpot(){
    var spots = [{x:0,y:0},{x:6*BLOCK,y:0},{x:12*BLOCK,y:0}];
    var free = spots.filter(function(s){
      for(var i=0;i<state.enemies.length;i++){
        var e = state.enemies[i];
        if(rectsOverlap(s.x,s.y,TANK,TANK,e.x,e.y,TANK,TANK)) return false;
      }
      if(state.player && rectsOverlap(s.x,s.y,TANK,TANK,state.player.x,state.player.y,TANK,TANK)) return false;
      return true;
    });
    if(!free.length) return null;
    return free[Math.floor(Math.random()*free.length)];
  }
  function spawnEnemy(){
    if(!state.enemyQueue.length) return;
    var type = state.enemyQueue.shift();
    var spot = pickSpawnSpot();
    if(!spot){ state.enemyQueue.unshift(type); return; }
    state.enemies.push(makeEnemy(type, spot.x, spot.y));
  }

  /* ============================= 碰撞 ============================= */
  function tankCollides(x, y, self){
    if(x < 0 || y < 0 || x + TANK > FIELD || y + TANK > FIELD) return true;
    var x0 = Math.floor(x/BLOCK), x1 = Math.floor((x+TANK-1)/BLOCK);
    var y0 = Math.floor(y/BLOCK), y1 = Math.floor((y+TANK-1)/BLOCK);
    for(var gy=y0; gy<=y1; gy++){
      for(var gx=x0; gx<=x1; gx++){
        var t = state.grid[gy][gx];
        if(t===T_BRICK || t===T_STEEL || t===T_WATER || t===T_BASE) return true;
      }
    }
    for(var i=0;i<state.enemies.length;i++){
      var e = state.enemies[i];
      if(e !== self && rectsOverlap(x,y,TANK,TANK,e.x,e.y,TANK,TANK)) return true;
    }
    if(self !== state.player && state.player &&
       rectsOverlap(x,y,TANK,TANK,state.player.x,state.player.y,TANK,TANK)) return true;
    return false;
  }
  function moveTank(t, dx, dy, dt){
    var vx = dx, vy = dy;
    if(dx && dy){ vx *= Math.SQRT1_2; vy *= Math.SQRT1_2; }
    var nx = clamp(t.x + vx*t.speed*dt, 0, FIELD-TANK);
    var ny = clamp(t.y + vy*t.speed*dt, 0, FIELD-TANK);
    if(!tankCollides(nx, t.y, t)) t.x = nx;
    if(!tankCollides(t.x, ny, t)) t.y = ny;
  }
  function pointInTank(px, py, t){
    return px >= t.x && px <= t.x+TANK && py >= t.y && py <= t.y+TANK;
  }

  /* ============================= 子弹 ============================= */
  function barrelPos(t){
    return { x: t.x+16 + DIRX[t.dir]*19, y: t.y+16 + DIRY[t.dir]*19 };
  }
  function shoot(t){
    var owner = t.isPlayer ? 'player' : 'enemy';
    var maxB = t.isPlayer ? (t.power>=1 ? 2 : 1) : 1;
    var cnt = 0;
    for(var i=0;i<state.bullets.length;i++) if(state.bullets[i].owner===owner) cnt++;
    if(cnt >= maxB) return;
    var speed = t.isPlayer ? (t.power>=1 ? 340 : 260) : t.bulletSpeed;
    var pow = (t.isPlayer && t.power>=2) ? 1 : 0;
    var b = barrelPos(t);
    state.bullets.push({ x:b.x, y:b.y, dir:t.dir, speed:speed, owner:owner, power:pow });
    playSound('shoot');
  }
  function spawnExplosion(x, y, color){
    color = color || '#ffb74d';
    for(var i=0;i<12;i++){
      state.effects.push({
        x:x, y:y, color:color,
        vx:(Math.random()-0.5)*130, vy:(Math.random()-0.5)*130,
        life:0.4+Math.random()*0.35
      });
    }
  }
  function bulletHit(b){
    var r = 3;
    if(b.x < r || b.y < r || b.x > FIELD-r || b.y > FIELD-r) return true;
    var gx = Math.floor(b.x/BLOCK), gy = Math.floor(b.y/BLOCK);
    if(gy>=0 && gy<ROWS && gx>=0 && gx<COLS){
      var t = state.grid[gy][gx];
      if(t === T_BRICK){
        state.grid[gy][gx] = T_EMPTY;
        spawnExplosion(gx*BLOCK+16, gy*BLOCK+16, '#d9822b');
        playSound('brick');
        return true;
      }
      if(t === T_STEEL){
        if(b.power >= 1){ state.grid[gy][gx] = T_EMPTY; spawnExplosion(gx*BLOCK+16, gy*BLOCK+16, '#cfd6e0'); playSound('steel'); }
        else playSound('steelHit');
        return true;
      }
      if(t === T_BASE){
        destroyBase();
        return true;
      }
      // 水、树：子弹穿过
    }
    if(b.owner === 'player'){
      for(var i=0;i<state.enemies.length;i++){
        var e = state.enemies[i];
        if(!e.dead && pointInTank(b.x, b.y, e)){ hitEnemy(e); return true; }
      }
    } else {
      var p = state.player;
      if(p && pointInTank(b.x, b.y, p)){ hitPlayer(); return true; }
    }
    return false;
  }

  /* ============================= 命中 ============================= */
  function hitEnemy(e){
    e.hp--;
    e.flash = 0.12;
    if(e.hp <= 0){
      e.dead = true;
      state.score += e.score;
      spawnExplosion(e.x+16, e.y+16, '#ff8f3d');
      playSound('explosion');
      if(e.type === 'carrier') dropPowerup(e.x, e.y);
    }
  }
  function hitPlayer(){
    var p = state.player;
    if(!p) return;
    if(p.invincible > 0) return;
    state.lives--;
    spawnExplosion(p.x+16, p.y+16, '#ffd54f');
    playSound('explosion');
    updateHUD();
    if(state.lives < 0){
      gameOver();
    } else {
      state.player = makePlayer(); // 重生并短暂无敌，火力重置
    }
  }
  function destroyBase(){
    // 基地块转为空并爆炸
    for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++) if(state.grid[y][x]===T_BASE) state.grid[y][x]=T_EMPTY;
    spawnExplosion(6*BLOCK+16, 12*BLOCK+16, '#ef5350');
    spawnExplosion(6*BLOCK+16, 12*BLOCK+16, '#ffd54f');
    playSound('explosion');
    gameOver();
  }

  /* ============================= 道具 ============================= */
  var POWER_TYPES = ['star','life','shield','freeze'];
  function dropPowerup(x, y){
    var type = POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)];
    state.powerups.push({ x:x+8, y:y+8, type:type, ttl:14 });
  }
  function applyPowerup(pu){
    switch(pu.type){
      case 'star':   state.player.power = Math.min(2, state.player.power+1); break;
      case 'life':   state.lives = Math.min(5, state.lives+1); break;
      case 'shield': state.player.invincible = 8; break;
      case 'freeze': state.freezeTimer = 6; break;
    }
    spawnExplosion(pu.x+8, pu.y+8, '#7ef29a');
    playSound('pickup');
    updateHUD();
  }

  /* ============================= 更新逻辑 ============================= */
  function update(dt){
    animTime += dt;

    if(state.freezeTimer > 0) state.freezeTimer -= dt;

    // 玩家
    var p = state.player;
    if(p){
      if(p.invincible > 0) p.invincible -= dt;
      if(p.flash > 0) p.flash -= dt;
      var dx=0, dy=0;
      if(keys.has('up')) dy = -1;
      else if(keys.has('down')) dy = 1;
      if(keys.has('left')) dx = -1;
      else if(keys.has('right')) dx = 1;
      if(dy !== 0) p.dir = dy>0 ? 2 : 0;
      else if(dx !== 0) p.dir = dx>0 ? 1 : 3;
      if(dx || dy) moveTank(p, dx, dy, dt);
      if(p.cooldown > 0) p.cooldown -= dt;
      if(keys.has('fire') && p.cooldown <= 0){ shoot(p); p.cooldown = 0.18; }
      // 拾取道具
      for(var i=0;i<state.powerups.length;i++){
        var pu = state.powerups[i];
        if(rectsOverlap(p.x,p.y,TANK,TANK, pu.x,pu.y,16,16)){ applyPowerup(pu); state.powerups.splice(i,1); i--; }
      }
    }

    // 敌人
    for(var i=0;i<state.enemies.length;i++){
      var e = state.enemies[i];
      if(e.flash > 0) e.flash -= dt;
      if(state.freezeTimer <= 0){
        e.think -= dt;
        e.cooldown -= dt;
        if(e.think <= 0){
          e.think = 0.5 + Math.random()*1.4;
          e.dir = Math.floor(Math.random()*4);
        }
        var ox=e.x, oy=e.y;
        moveTank(e, DIRX[e.dir], DIRY[e.dir], dt);
        if(e.x===ox && e.y===oy){ e.dir = Math.floor(Math.random()*4); e.think = 0.2+Math.random()*0.4; }
        if(e.cooldown <= 0){ shoot(e); e.cooldown = 1.1 + Math.random()*1.7; }
      }
    }
    state.enemies = state.enemies.filter(function(e){ return !e.dead; });

    // 子弹
    for(var i=0;i<state.bullets.length;i++){
      var b = state.bullets[i];
      var steps = Math.max(1, Math.ceil(b.speed*dt / 3));
      for(var s=0;s<steps && !b.dead;s++){
        b.x += DIRX[b.dir] * (b.speed*dt/steps);
        b.y += DIRY[b.dir] * (b.speed*dt/steps);
        if(bulletHit(b)){ b.dead = true; }
      }
    }
    state.bullets = state.bullets.filter(function(b){ return !b.dead; });

    // 道具过期
    for(var i=0;i<state.powerups.length;i++){
      state.powerups[i].ttl -= dt;
      if(state.powerups[i].ttl <= 0) state.powerups.splice(i--,1);
    }

    // 敌人生成
    if(state.enemyQueue.length > 0 && state.enemies.length < 4){
      state.spawnTimer -= dt;
      if(state.spawnTimer <= 0){
        spawnEnemy();
        state.spawnTimer = 1.4;
      }
    }

    // 胜负判定
    if(state.enemyQueue.length === 0 && state.enemies.length === 0){
      levelClear();
    }
  }

  function updateEffects(dt){
    for(var i=0;i<state.effects.length;i++){
      var e = state.effects[i];
      e.life -= dt;
      e.x += e.vx*dt;
      e.y += e.vy*dt;
    }
    state.effects = state.effects.filter(function(e){ return e.life > 0; });
  }

  /* ============================= 渲染 ============================= */
  function drawBrick(x,y){
    ctx.fillStyle = '#c0572f';
    ctx.fillRect(x,y,BLOCK,BLOCK);
    ctx.fillStyle = '#8f3d1f';
    ctx.fillRect(x,y+7,BLOCK,2);
    ctx.fillRect(x,y+15,BLOCK,2);
    ctx.fillRect(x,y+23,BLOCK,2);
    ctx.fillRect(x+9,y,2,7);  ctx.fillRect(x+21,y+8,2,7);
    ctx.fillRect(x+4,y+8,2,7); ctx.fillRect(x+25,y+16,2,7);
    ctx.fillRect(x+12,y+16,2,7); ctx.fillRect(x+3,y+24,2,8);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(x,y,BLOCK,1);
  }
  function drawSteel(x,y){
    ctx.fillStyle = '#7e8794';
    ctx.fillRect(x,y,BLOCK,BLOCK);
    ctx.fillStyle = '#aeb6c2';
    ctx.fillRect(x,y,BLOCK,3); ctx.fillRect(x,y,3,BLOCK);
    ctx.fillStyle = '#565e6b';
    ctx.fillRect(x,y+BLOCK-3,BLOCK,3); ctx.fillRect(x+BLOCK-3,y,3,BLOCK);
    ctx.fillStyle = '#6a7280';
    ctx.fillRect(x+5,y+5,BLOCK-10,BLOCK-10);
    ctx.fillStyle = '#98a1af';
    ctx.fillRect(x+8,y+8,BLOCK-16,BLOCK-16);
  }
  function drawWater(x,y){
    ctx.fillStyle = '#2050a8';
    ctx.fillRect(x,y,BLOCK,BLOCK);
    ctx.fillStyle = '#3f74d6';
    var off = (Math.floor(animTime*3) % 24);
    for(var i=-1;i<2;i++){
      ctx.fillRect(x+2+((off+i*12+24)%24), y+8, 8, 3);
      ctx.fillRect(x+2+((off+i*12+36)%24), y+20, 8, 3);
    }
  }
  function drawTree(x,y){
    ctx.fillStyle = '#3d2b1f';
    ctx.fillRect(x+13,y+22,6,10);
    ctx.fillStyle = '#2f7d34';
    ctx.beginPath(); ctx.arc(x+10,y+14,8,0,7); ctx.arc(x+22,y+14,8,0,7); ctx.arc(x+16,y+9,9,0,7); ctx.fill();
    ctx.fillStyle = '#3fa24a';
    ctx.beginPath(); ctx.arc(x+12,y+11,5,0,7); ctx.arc(x+20,y+11,5,0,7); ctx.fill();
  }
  function drawBase(x,y){
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(x+3,y+9,26,21);
    ctx.fillStyle = '#7a6146';
    ctx.fillRect(x+5,y+11,22,17);
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(x+7,y+15,18,11);
    ctx.fillStyle = '#ffe082';
    ctx.fillRect(x+12,y+16,8,6);
    ctx.fillStyle = '#eeeeee';
    ctx.fillRect(x+14,y+2,3,13);
    ctx.fillStyle = '#ef5350';
    ctx.beginPath();
    ctx.moveTo(x+17,y+2); ctx.lineTo(x+27,y+5); ctx.lineTo(x+17,y+9); ctx.closePath();
    ctx.fill();
  }
  function drawTiles(){
    ctx.fillStyle = '#141821';
    ctx.fillRect(0,0,FIELD,FIELD);
    for(var y=0;y<ROWS;y++){
      for(var x=0;x<COLS;x++){
        var t = state.grid[y][x];
        var px=x*BLOCK, py=y*BLOCK;
        if(t===T_BRICK) drawBrick(px,py);
        else if(t===T_STEEL) drawSteel(px,py);
        else if(t===T_WATER) drawWater(px,py);
        else if(t===T_BASE) drawBase(px,py);
      }
    }
  }
  function drawTank(t){
    var blink = t.invincible>0 && Math.floor(animTime*10)%2===0;
    var cx = t.x+16, cy = t.y+16;
    if(blink) return;
    var color = t.color;
    if(t.flash>0) color = '#ffffff';
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI/2);
    // 履带
    ctx.fillStyle = '#23272e';
    ctx.fillRect(-16,-16,6,32);
    ctx.fillRect(10,-16,6,32);
    ctx.fillStyle = '#3b4048';
    for(var i=-14;i<16;i+=6){ ctx.fillRect(-16,i,6,2); ctx.fillRect(10,i,6,2); }
    // 车体
    ctx.fillStyle = color;
    ctx.fillRect(-11,-12,22,24);
    ctx.fillStyle = shade(color, -28);
    ctx.fillRect(-11,-12,22,3);
    // 炮塔
    ctx.fillStyle = shade(color, 18);
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    // 炮管
    ctx.fillStyle = shade(color, -20);
    ctx.fillRect(-3,-23,6,13);
    ctx.fillStyle = shade(color, 30);
    ctx.fillRect(-1,-23,2,13);
    ctx.restore();

    // 护盾
    if(t.invincible>0){
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,255,' + (0.35+0.25*Math.sin(animTime*8)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx,cy,20,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(80,200,255,0.08)';
      ctx.fill();
      ctx.restore();
    }
    // 冻结
    if(!t.isPlayer && state.freezeTimer>0){
      ctx.fillStyle = 'rgba(120,200,255,0.35)';
      ctx.fillRect(t.x,t.y,TANK,TANK);
    }
  }
  function drawBullet(b){
    ctx.fillStyle = b.owner==='player' ? '#ffe9a8' : '#ffb3b3';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.4, 0, Math.PI*2); ctx.fill();
  }
  function drawPowerup(pu){
    var blink = pu.ttl < 3 && Math.floor(animTime*6)%2===0;
    if(blink) return;
    ctx.fillStyle = 'rgba(20,24,32,.85)';
    ctx.fillRect(pu.x-1, pu.y-1, 18, 18);
    ctx.strokeStyle = '#f7c948';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(pu.x-1, pu.y-1, 18, 18);
    var icon = {star:'⭐', life:'❤️', shield:'🛡️', freeze:'❄️'}[pu.type] || '⭐';
    ctx.font = '15px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, pu.x+8, pu.y+9);
  }
  function drawEffects(){
    for(var i=0;i<state.effects.length;i++){
      var e = state.effects[i];
      ctx.globalAlpha = Math.max(0, e.life/0.7);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x-2, e.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }
  function drawTrees(){
    for(var y=0;y<ROWS;y++){
      for(var x=0;x<COLS;x++){
        if(state.grid[y][x]===T_TREE) drawTree(x*BLOCK, y*BLOCK);
      }
    }
  }
  function render(){
    drawTiles();
    for(var i=0;i<state.powerups.length;i++) drawPowerup(state.powerups[i]);
    for(var i=0;i<state.enemies.length;i++) drawTank(state.enemies[i]);
    if(state.player) drawTank(state.player);
    for(var i=0;i<state.bullets.length;i++) drawBullet(state.bullets[i]);
    drawTrees();
    drawEffects();
  }

  /* ============================= 主循环 ============================= */
  var last = performance.now();
  function loop(now){
    var dt = Math.min((now - last)/1000, 0.05);
    last = now;
    updateEffects(dt);
    if(state.mode === 'playing') update(dt);
    render();
    if(state.mode === 'playing' || state.mode === 'pause') updateHUD();
    requestAnimationFrame(loop);
  }

  /* ============================= HUD / 界面 ============================= */
  function updateHUD(){
    $('score').textContent = state.score;
    $('lives').textContent = '❤️'.repeat(Math.max(0, state.lives));
    $('level').textContent = state.level+1;
    $('enemies').textContent = state.enemyQueue.length + state.enemies.length;
    $('muteBtn').textContent = muted ? '🔇' : '🔊';
    $('pauseBtn').textContent = state.mode==='pause' ? '▶️' : '⏸️';
  }
  function showOverlay(id){
    var ids = ['ov-menu','ov-pause','ov-levelclear','ov-gameover','ov-win'];
    for(var i=0;i<ids.length;i++) $(ids[i]).classList.toggle('hidden', ids[i]!==id);
  }

  function resetLevel(level){
    state.level = level;
    state.grid = parseMap(LEVELS[level]);
    state.enemies = [];
    state.bullets = [];
    state.powerups = [];
    state.effects = [];
    state.enemyQueue = ENEMY_SETS[level].slice();
    state.spawnTimer = 0.6;
    state.freezeTimer = 0;
    state.player = makePlayer();
    state.mode = 'playing';
    showOverlay(null);
    updateHUD();
  }
  function startGame(){
    ensureAudio();
    state.score = 0;
    state.lives = 3;
    resetLevel(0);
  }
  function nextLevel(){
    var savedPower = state.player ? state.player.power : 0;
    var lvl = state.level + 1;
    resetLevel(lvl);
    state.player.power = savedPower;
  }
  function gameOver(){
    if(state.mode==='gameover' || state.mode==='win') return;
    state.mode = 'gameover';
    $('finalScore').textContent = state.score;
    playSound('gameover');
    showOverlay('ov-gameover');
    updateHUD();
  }
  function winGame(){
    state.mode = 'win';
    $('winScore').textContent = state.score;
    playSound('win');
    showOverlay('ov-win');
    updateHUD();
  }
  function levelClear(){
    var bonus = 500 + state.level*200;
    state.score += bonus;
    if(state.level >= LEVELS.length-1){
      winGame();
    } else {
      state.mode = 'levelclear';
      $('levelBonus').textContent = '奖励 +' + bonus + ' 分';
      showOverlay('ov-levelclear');
      updateHUD();
    }
  }

  /* ============================= 输入 ============================= */
  function kname(e){
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': return 'up';
      case 'ArrowDown': case 's': case 'S': return 'down';
      case 'ArrowLeft': case 'a': case 'A': return 'left';
      case 'ArrowRight': case 'd': case 'D': return 'right';
      case ' ': case 'j': case 'J': return 'fire';
      default: return null;
    }
  }
  function handleEnter(){
    if(state.mode==='menu') startGame();
    else if(state.mode==='gameover' || state.mode==='win') startGame();
    else if(state.mode==='levelclear') nextLevel();
    else if(state.mode==='pause') resumeGame();
  }
  function togglePause(){
    if(state.mode==='playing'){ state.mode='pause'; showOverlay('ov-pause'); updateHUD(); }
    else if(state.mode==='pause') resumeGame();
  }
  function resumeGame(){
    state.mode='playing'; showOverlay(null); updateHUD();
  }
  function toggleMute(){ muted = !muted; updateHUD(); }

  window.addEventListener('keydown', function(e){
    var n = kname(e);
    if(n){ keys.add(n); e.preventDefault(); return; }
    if(e.key==='Enter'){ handleEnter(); e.preventDefault(); }
    else if(e.key==='p' || e.key==='P'){ togglePause(); }
    else if(e.key==='m' || e.key==='M'){ toggleMute(); }
  });
  window.addEventListener('keyup', function(e){
    var n = kname(e);
    if(n) keys.delete(n);
  });

  /* 按钮 */
  $('btn-start').addEventListener('click', startGame);
  $('btn-resume').addEventListener('click', resumeGame);
  $('btn-next').addEventListener('click', nextLevel);
  $('btn-restart').addEventListener('click', startGame);
  $('btn-again').addEventListener('click', startGame);
  $('muteBtn').addEventListener('click', toggleMute);
  $('pauseBtn').addEventListener('click', togglePause);

  /* ============================= 启动 ============================= */
  state.grid = parseMap(LEVELS[0]);
  showOverlay('ov-menu');
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
